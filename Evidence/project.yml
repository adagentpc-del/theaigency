name: Evidence
options:
  bundleIdPrefix: com.theaigency
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    SWIFT_VERSION: 5.0
targets:
  Evidence:
    type: application
    platform: iOS
    sources: [Evidence]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theaigency.evidence
        PRODUCT_NAME: Evidence
        INFOPLIST_KEY_CFBundleDisplayName: Evidence
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Add screenshots or images that document your own wins and feedback.
        TARGETED_DEVICE_FAMILY: 1
    scheme:
      testTargets: []
