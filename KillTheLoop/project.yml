name: KillTheLoop
options:
  bundleIdPrefix: com.theaigency
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    SWIFT_VERSION: 5.0
targets:
  KillTheLoop:
    type: application
    platform: iOS
    sources: [KillTheLoop]
    resources: [Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theaigency.killtheloop
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kill The Loop
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: [KillTheLoopTests]
  KillTheLoopTests:
    type: bundle.unit-test
    platform: iOS
    sources: [KillTheLoopTests]
    hostApplication: KillTheLoop
    dependencies:
      - target: KillTheLoop
