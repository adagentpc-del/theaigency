name: KillTheLoop
options:
  bundleIdPrefix: com.theaigency
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    SWIFT_VERSION: 5.0
targets:
  KillTheLoop:
    type: application
    platform: iOS
    sources: [KillTheLoop]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theaigency.killtheloop
        PRODUCT_NAME: Kill The Loop
        INFOPLIST_KEY_CFBundleDisplayName: Kill The Loop
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: 1
    scheme:
      testTargets: []
