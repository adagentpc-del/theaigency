name: Verify shared AI gateway

on:
  push:
    paths:
      - 'platform/ai-gateway/**'
      - '.github/workflows/ai-gateway.yml'
  pull_request:
    paths:
      - 'platform/ai-gateway/**'
      - '.github/workflows/ai-gateway.yml'
  workflow_dispatch:

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/ai-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run verify
      - name: Build production gateway image
        run: docker build -t theaigincy-ai-gateway:test .
      - name: Validate production compose
        working-directory: platform/ai-gateway/deploy
        env:
          API_DOMAIN: api.example.com
          ACME_EMAIL: ci@example.com
          LOCAL_LLM_MODEL: qwen3:4b
        run: docker compose -f docker-compose.prod.yml config >/dev/null
