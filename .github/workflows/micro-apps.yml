name: Micro Apps iOS
on:
  push:
    branches: [chatgpt/microapps-sept3]
  pull_request:
    paths:
      - 'KeepOne/**'
      - 'Evidence/**'
      - 'KillTheLoop/**'
jobs:
  build:
    runs-on: macos-15
    strategy:
      matrix:
        app:
          - { dir: KeepOne, scheme: KeepOne }
          - { dir: Evidence, scheme: Evidence }
          - { dir: KillTheLoop, scheme: KillTheLoop }
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ${{ matrix.app.dir }}
        run: xcodegen generate
      - name: Build
        working-directory: ${{ matrix.app.dir }}
        run: xcodebuild -project ${{ matrix.app.scheme }}.xcodeproj -scheme ${{ matrix.app.scheme }} -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16 Pro' CODE_SIGNING_ALLOWED=NO build
